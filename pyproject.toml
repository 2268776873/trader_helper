[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trade-helper"
version = "0.1.0"
description = "Windows-first low-frequency ETF position management assistant"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "trade_helper contributors" }]
dependencies = ["openpyxl>=3.1,<4"]

[project.scripts]
trade-helper = "trade_helper.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
